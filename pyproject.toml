[project]
name = "proyecto-bodegas-del-atuel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.52.0",
    "fastapi>=0.162.2",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# La API vive en api/, asi que 'app' se importa desde ahi.
pythonpath = ["api", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

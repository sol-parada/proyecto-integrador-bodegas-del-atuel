
services:
  db_etapa3:
    image: postgres:16
    container_name: bodegas-etapa3-test
    restart: "no"
    environment:
      POSTGRES_DB: bodegas_etapa3_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ETAPA3_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - etapa3_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d bodegas_etapa3_test
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  etapa3_test_data:

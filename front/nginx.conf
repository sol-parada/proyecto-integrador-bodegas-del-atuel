# =============================================================================
# BODEGAS DEL ATUEL - Configuracion de Nginx para el front
#
# Sirve los archivos estaticos del front y reenvia las llamadas de la API
# al servicio 'api'. El front usa VITE_API_BASE_URL=/api, por lo que el
# proxy es transparente y no hace falta configurar CORS.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Llamadas a la API REST.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Documentacion interactiva de la API.
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # El front es una SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# =============================================================================
# BODEGAS DEL ATUEL - Docker Compose
#
# Un solo comando levanta el proyecto completo:
#
#   docker compose up -d --build
#
# Servicios:
#   db       PostgreSQL 16. En la primera ejecucion crea el volumen y aplica
#            solo las migraciones (esquema + rol de la API). Los datos de
#            la carga masiva se cargan con el seeder de Python.
#   rol      Sincroniza la contrasena del rol app_api con el .env, para que
#            la API siempre pueda conectarse.
#   api      API REST en FastAPI, conectada con el rol app_api.
#   front    Frontend React servido por Nginx, con proxy hacia la API.
# =============================================================================

services:
  db:
    image: postgres:16
    container_name: bodegas-atuel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - etapa3_test_data:/var/lib/postgresql/data
      # La primera vez que se crea el volumen, se aplican las migraciones.
      - ./database/migrations:/migrations:ro
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      # Scripts de prueba SQL de la etapa 2.
      - ./database/tests:/pruebas:ro
      - ./docker/pruebas:/pruebas_script:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_class WHERE relname='comprobante'\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Sincroniza la contrasena del rol de la API con la del .env.
  # Se ejecuta una vez y termina. La API depende de que termine bien.
  rol:
    image: postgres:16
    container_name: bodegas-atuel-rol
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - ./docker/sincronizar-rol.sh:/sincronizar-rol.sh:ro
    entrypoint: ["bash", "/sincronizar-rol.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bodegas-atuel-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rol:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      DB_HOST: db
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: bodegas-atuel-front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONT_PORT}:80"

volumes:
  etapa3_test_data:
